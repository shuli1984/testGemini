<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">{{.SiteConfig.Title}}</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="{{T .CurrentLang "common.toggle_navigation"}}">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/">{{T .CurrentLang "common.home_menu"}}</a>
                </li>
                {{range .SiteConfig.Navigation}}
                <li class="nav-item">
                    <a class="nav-link" href="{{if eq .Type "page"}}/page/{{.Value}}{{else if eq .Type "internal"}}/{{.Value}}{{else}}{{.Value}}{{end}}" {{if .NewTab}}target="_blank"{{end}}>{{.Label}}</a>
                </li>
                {{end}}
            </ul>
            <div class="language-switcher">
                <select id="lang-select" class="form-select form-select-sm">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ja">日本語</option>
                </select>
            </div>
        </div>
    </div>
</nav>
