{{define "header.html"}}
    <meta charset="UTF-8">
    <title>{{if .Page}}{{.Page.Content.Title}} - {{.SiteConfig.Title}}{{else}}{{.SiteConfig.Title}}{{end}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <meta name="description" content="{{if .Page}}{{.Page.Content.Description}}{{else}}{{.SiteConfig.MetaDescription}}{{end}}">
    <meta name="keywords" content="{{if .Page}}{{.Page.Content.Keywords}}{{else}}{{.SiteConfig.MetaKeywords}}{{end}}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{if .Page}}{{.Page.Content.Title}}{{else}}{{.SiteConfig.Title}}{{end}}">
    <meta property="og:description" content="{{if .Page}}{{.Page.Content.Description}}{{else}}{{.SiteConfig.MetaDescription}}{{end}}">
    <meta property="og:image" content="{{.SiteConfig.Logo}}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="{{if .Page}}{{.Page.Content.Title}}{{else}}{{.SiteConfig.Title}}{{end}}">
    <meta property="twitter:description" content="{{if .Page}}{{.Page.Content.Description}}{{else}}{{.SiteConfig.MetaDescription}}{{end}}">
    <meta property="twitter:image" content="{{.SiteConfig.Logo}}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const langSelect = document.getElementById('lang-select');
            if (langSelect) {
                langSelect.value = "{{.CurrentLang}}"; // Set initial value
                langSelect.addEventListener('change', function() {
                    const selectedLang = this.value;
                    // Set a cookie or local storage for language preference
                    document.cookie = "lang=" + selectedLang + "; path=/; max-age=" + (365 * 24 * 60 * 60); // 1 year
                    window.location.reload(); // Reload page to apply new language
                });
            }
        });
    </script>
{{end}}
