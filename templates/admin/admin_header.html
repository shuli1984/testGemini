<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
    {{T .CurrentLang "admin.admin_panel"}} -
    {{if eq .CurrentPath "/admin/pages/new"}}
        {{T .CurrentLang "admin.new_page_title"}}
    {{else if hasPrefix .CurrentPath "/admin/pages/edit/"}}
        {{T .CurrentLang "admin.edit_page_title"}}
    {{else if eq .CurrentPath "/admin/dashboard"}}
        {{T .CurrentLang "admin.dashboard_title"}}
    {{else if eq .CurrentPath "/admin/pages"}}
        {{T .CurrentLang "menu.pages_menu"}}
    {{else if eq .CurrentPath "/admin/templates"}}
        {{T .CurrentLang "menu.templates_menu"}}
    {{else if eq .CurrentPath "/admin/settings"}}
        {{T .CurrentLang "menu.site_settings_menu"}}
    {{else}}
        {{T .CurrentLang "common.unknown_title"}}
    {{end}}
</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/static/css/admin.css" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const langSelect = document.getElementById('lang-select');
            if (langSelect) {
                langSelect.value = "{{.CurrentLang}}"; // Set initial value
                langSelect.addEventListener('change', function() {
                    const selectedLang = this.value;
                    // Set a cookie or local storage for language preference
                    document.cookie = "lang=" + selectedLang + "; path=/; max-age=" + (365 * 24 * 60 * 60); // 1 year
                    window.location.reload(); // Reload page to apply new language
                });
            }
        });
    </script>
</head>
