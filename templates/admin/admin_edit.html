<!DOCTYPE html>
<html lang="en">
{{template "admin_header.html" .}}
<body>
    {{template "admin_nav.html" .}}

    <h1>Edit Page Content</h1>

    <form id="editPageForm">
        <div>
            <label for="pageName">Page Name (e.g., home, about, contact):</label>
            <input type="text" id="pageName" value="home" required>
        </div>
        <div>
            <label for="title">Title:</label>
            <input type="text" id="title" required>
        </div>
        <div>
            <label for="description">Description:</label>
            <textarea id="description"></textarea>
        </div>
        <div>
            <label for="message">Message:</label>
            <textarea id="message"></textarea>
        </div>
        <button type="submit">Save Changes</button>
    </form>

    <div id="response"></div>

    <script src="/static/js/admin_edit.js"></script>

    {{template "admin_footer.html" .}}
</body>
</html>
