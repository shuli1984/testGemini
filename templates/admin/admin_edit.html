<!DOCTYPE html>
<html lang="{{.CurrentLang}}">
{{template "admin/admin_header.html" .}}
<body>
    <div class="d-flex flex-column flex-md-row min-vh-100">
        <div class="border-end">
            {{template "admin/admin_nav.html" .}}
        </div>
        <div class="p-4 shadow-sm flex-grow-1 d-flex flex-column">
            <h1 class="mb-4">{{.Title}}</h1>

            <form id="pageForm" class="d-flex flex-column flex-grow-1">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <div class="mb-3">
                    <label for="pageName" class="form-label">{{T .CurrentLang "page_name_label"}}</label>
                    <input type="text" id="pageName" value="{{.Page.Name}}" class="form-control" required {{if not .IsNew}}readonly{{end}}>
                </div>
                <div class="mb-3">
                    <label for="title" class="form-label">{{T .CurrentLang "title_label"}}</label>
                    <input type="text" id="title" value="{{.Page.Title}}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">{{T .CurrentLang "description_label"}}</label>
                    <textarea id="description" class="form-control">{{.Page.Description}}</textarea>
                </div>
                <div class="mb-3 d-flex flex-column flex-grow-1">
                    <label for="message" class="form-label">{{T .CurrentLang "message_label"}}</label>
                    <div id="message" class="flex-grow-1">{{.Message}}</div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">{{if .IsNew}}{{T .CurrentLang "create_page_button"}}{{else}}{{T .CurrentLang "save_changes_button"}}{{end}}</button>
                    <button type="button" id="previewButton" class="btn btn-secondary">{{T .CurrentLang "preview_button"}}</button>
                    <button type="button" id="toggleHtmlButton" class="btn btn-secondary">{{T .CurrentLang "toggle_html_button"}}</button>
                </div>
            </form>

            <div id="response" class="mt-3"></div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal fade" id="previewModal" tabindex="-1" aria-labelledby="previewModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="previewModalLabel">{{T .CurrentLang "preview_title"}}</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{T .CurrentLang "close_button_aria_label"}}"></button>
          </div>
          <div class="modal-body" id="previewContent">
            <!-- Preview content will be injected here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Include the Quill library -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <!-- Initialize Quill editor and add event listeners -->
    <script>
      const isNew = {{.IsNew}};

      function imageHandler() {
        var input = document.createElement('input');
        input.setAttribute('type', 'file');
        input.setAttribute('accept', 'image/*');
        input.click();

        input.onchange = async () => {
          var file = input.files[0];
          var formData = new FormData();
          formData.append('image', file);
          const csrfToken = document.querySelector('input[name="csrf_token"]').value;

          const response = await fetch('/admin/upload', {
            method: 'POST',
            headers: {
              'X-CSRF-Token': csrfToken
            },
            body: formData
          });

          const result = await response.json();
          if (response.ok) {
            const imageUrl = result.url;
            const range = quill.getSelection();
            quill.insertEmbed(range.index, 'image', imageUrl);
          } else {
            console.error('Upload failed:', result);
          }
        };
      }

      var quill = new Quill('#message', {
        theme: 'snow',
        modules: {
          toolbar: {
            container: [
              [{ 'font': [] }],
              [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
              [{ 'color': [] }, { 'background': [] }],
              [{ 'align': [] }],
              ['bold', 'italic', 'underline', 'strike'],
              ['blockquote', 'code-block'],
              [{ 'list': 'ordered'}, { 'list': 'bullet' }],
              [{ 'script': 'sub'}, { 'script': 'super' }],
              [{ 'indent': '-1'}, { 'indent': '+1' }],
              [{ 'direction': 'rtl' }],
              ['link', 'image', 'video'],
              ['clean']
            ],
            handlers: {
              'image': imageHandler
            }
          }
        }
      });

      document.getElementById('previewButton').addEventListener('click', () => {
        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const message = quill.root.innerHTML;

        const previewContentDiv = document.getElementById('previewContent');
        previewContentDiv.innerHTML = '';

        const titleEl = document.createElement('h1');
        titleEl.textContent = title;

        const descriptionEl = document.createElement('p');
        descriptionEl.textContent = description;

        const messageDiv = document.createElement('div');
        messageDiv.innerHTML = message;

        previewContentDiv.appendChild(titleEl);
        previewContentDiv.appendChild(descriptionEl);
        previewContentDiv.appendChild(messageDiv);

        const previewModal = new bootstrap.Modal(document.getElementById('previewModal'));
        previewModal.show();
      });

      let isHtmlMode = false;
      let htmlTextarea;

      document.getElementById('toggleHtmlButton').addEventListener('click', () => {
        const messageContainer = document.getElementById('message');
        if (isHtmlMode) {
          quill.root.innerHTML = htmlTextarea.value;
          quill.container.style.display = 'block';
          htmlTextarea.remove();
          isHtmlMode = false;
        } else {
          htmlTextarea = document.createElement('textarea');
          htmlTextarea.style.width = '100%';
          htmlTextarea.style.height = quill.container.offsetHeight + 'px';
          htmlTextarea.value = quill.root.innerHTML;
          quill.container.style.display = 'none';
          messageContainer.parentNode.insertBefore(htmlTextarea, messageContainer.nextSibling);
          isHtmlMode = true;
        }
      });

      document.getElementById('pageForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const pageName = document.getElementById('pageName').value;
        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const message = quill.root.innerHTML;
        const csrfToken = document.querySelector('input[name="csrf_token"]').value;

        const url = isNew ? '/admin/pages/new' : `/admin/pages/${pageName}`;
        const method = isNew ? 'POST' : 'PUT';

        const response = await fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': csrfToken
            },
            body: JSON.stringify({ Name: pageName, Title: title, Description: description, Message: message })
        });

        const responseDiv = document.getElementById('response');

        if (response.ok) {
            if (isNew) {
                const result = await response.json();
                window.location.href = `/admin/pages/edit/${result.Name}`;
            } else {
                responseDiv.innerHTML = `<div class="alert alert-success">{{T .CurrentLang "page_updated_success"}}</div>`;
            }
        } else {
            const contentType = response.headers.get("content-type");
            let errorMsg = '{{T .CurrentLang "unknown_error"}}';
            if (contentType && contentType.indexOf("application/json") !== -1) {
                const result = await response.json();
                errorMsg = result.message;
            } else {
                errorMsg = await response.text();
            }
            responseDiv.innerHTML = `<div class="alert alert-danger">${errorMsg}</div>`;
        }
    });
    </script>
{{template "admin/admin_footer.html" .}}
</body>
</html>
