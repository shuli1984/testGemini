<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{T .CurrentLang "login_title"}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card mt-5">
                    <div class="card-body">
                        <h1 class="card-title text-center">{{T .CurrentLang "login_title"}}</h1>
                        <form id="loginForm">
                            <input type="hidden" name="gorilla.csrf.Token" value="{{.CSRFToken}}">
                            <div class="mb-3">
                                <label for="username" class="form-label">{{T .CurrentLang "username_label"}}</label>
                                <input type="text" id="username" name="username" class="form-control" required autocomplete="username">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">{{T .CurrentLang "password_label"}}</label>
                                <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">{{T .CurrentLang "login_button"}}</button>
                        </form>
                        <div id="message" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            const csrfToken = document.querySelector('input[name="gorilla.csrf.Token"]').value;

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = result.message || '{{T .CurrentLang "login_successful"}}';
                    window.location.href = '/admin/dashboard'; // Redirect to dashboard
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = result.message || '{{T .CurrentLang "login_failed"}}';
                }
            } catch (error) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = '{{T .CurrentLang "network_error"}}' + error.message;
            }
        });
    </script>
</body>
</html>
