<!DOCTYPE html>
<html lang="{{.CurrentLang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Site.Title}} - {{T .CurrentLang "admin.maintenance_title"}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="d-flex align-items-center justify-content-center vh-100">
        <div class="text-center p-5 bg-white rounded shadow-sm">
            <h1 class="display-1 fw-bold">{{T .CurrentLang "admin.maintenance_oops"}}</h1>
            <p class="fs-3">{{T .CurrentLang "admin.maintenance_subheading"}}</p>
            <p class="lead">
                {{if .Site.MaintenanceMessage}}
                    {{.Site.MaintenanceMessage}}
                {{else}}
                    {{T .CurrentLang "admin.maintenance_message"}}
                {{end}}
            </p>
        </div>
    </div>
</body>
</html>
