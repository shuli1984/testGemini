{{template "base" .}}

{{define "content"}}
    <section class="section">
        <div class="container">
            <h1 class="section-title">{{T .CurrentLang "pages.all_pages_title"}}</h1>
            <div class="services-grid">
                {{range .Pages}}
                <a href="/page/{{.Name}}" class="service-card-link">
                    <div class="service-card">
                        <h3>{{.Title}}</h3>
                        <p>{{.Description}}</p>
                    </div>
                </a>
                {{end}}
            </div>
        </div>
    </section>
{{end}}
