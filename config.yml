server:
  address: ":8080"
routes:
  - path: "/"
    handler: "IndexHandler"
    methods:
      - "GET"
    auth_required: false
  - path: "/about"
    handler: "AboutHandler"
    methods:
      - "GET"
    auth_required: false
  - path: "/page/{name}"
    handler: "PageHandler"
    methods:
      - "GET"
    auth_required: false
  - path: "/pages"
    handler: "PagesListHandler"
    methods:
      - "GET"
    auth_required: false
  - path: "/admin/login"
    handler: "LoginHandler"
    methods:
      - "GET"
      - "POST"
    auth_required: false
  - path: "/admin/dashboard"
    handler: "DashboardHandler"
    methods:
      - "GET"
    auth_required: true
  - path: "/admin/pages"
    handler: "PagesHandler"
    methods:
      - "GET"
    auth_required: true
  - path: /admin/pages/new
    handler: AdminNewPageHandler
    methods: 
      - GET
      - POST
    auth_required: true
  - path: "/admin/pages/edit/{name}"
    handler: "AdminEditPageHandler"
    methods:
      - "GET"
    auth_required: true
  - path: "/admin/pages/{name}"
    handler: "UpdatePageHandler"
    methods:
      - "PUT"
    auth_required: true
  - path: /admin/pages/delete/{name}
    handler: DeletePageHandler
    methods: [DELETE]
    auth_required: true
  - path: /admin/templates
    handler: AdminTemplatesView
    methods: [GET]
    auth_required: true
  - path: /admin/templates/edit
    handler: AdminTemplateEditView
    methods: [GET]
    auth_required: true
  - path: /admin/templates/edit
    handler: AdminTemplateUpdate
    methods: [POST]
    auth_required: true
  - path: /admin/templates/preview
    handler: AdminTemplatePreview
    methods: [GET]
    auth_required: true
  - path: "/admin/upload"
    handler: "ImageUploadHandler"
    methods:
      - "POST"
    auth_required: true
  - path: "/admin/api/translate"
    handler: "TranslateHandler"
    methods:
      - "POST"
    auth_required: true
  - path: "/admin"
    handler: "AdminRedirectHandler"
    methods:
      - "GET"
    auth_required: true
  - path: "/admin/logout"
    handler: "LogoutHandler"
    methods:
      - "GET"
    auth_required: false
database:
  type: "sqlite"
  dsn: "./data/gemini.db"
auth:
  # SessionKey and CSRFKey should be loaded from environment variables for security.
  # Example: SESSION_KEY: os.Getenv("SESSION_KEY")
  # Example: CSRF_KEY: os.Getenv("CSRF_KEY")
  # Do NOT hardcode sensitive keys in version control.
  session_key:
  csrf_key:
  trusted_origins: # New field for CSRF trusted origins
    - "https://your-production-domain.com" # Placeholder for production
    - "http://localhost:8080" # For local development
static:
  url_prefix: "/static/"
  dir: "static"
translator:
  type: "mock"
  api_key: ""
i18n:
  default_language: "en"
