server:
  address: ":8080"
routes:
  - path: "/"
    handler: "IndexHandler"
    methods:
      - "GET"
    auth_required: false
  - path: "/about"
    handler: "AboutHandler"
    methods:
      - "GET"
    auth_required: false
  - path: "/page/{name}"
    handler: "PageHandler"
    methods:
      - "GET"
    auth_required: false
  - path: "/pages"
    handler: "PagesListHandler"
    methods:
      - "GET"
    auth_required: false
  - path: "/admin/login"
    handler: "LoginHandler"
    methods:
      - "GET"
      - "POST"
    auth_required: false
  - path: "/admin/dashboard"
    handler: "DashboardHandler"
    methods:
      - "GET"
    auth_required: true
  - path: "/admin/pages"
    handler: "PagesHandler"
    methods:
      - "GET"
    auth_required: true
  - path: /admin/pages/new
    handler: AdminNewPageHandler
    methods: 
      - GET
      - POST
    auth_required: true
  - path: "/admin/pages/edit/{name}"
    handler: "AdminEditPageHandler"
    methods:
      - "GET"
    auth_required: true
  - path: "/admin/pages/{name}"
    handler: "UpdatePageHandler"
    methods:
      - "PUT"
    auth_required: true
  - path: /admin/pages/delete/{name}
    handler: DeletePageHandler
    methods: [DELETE]
    auth_required: true
  - path: "/admin/upload"
    handler: "ImageUploadHandler"
    methods:
      - "POST"
    auth_required: true
  - path: "/admin"
    handler: "AdminRedirectHandler"
    methods:
      - "GET"
    auth_required: true
  - path: "/admin/logout"
    handler: "LogoutHandler"
    methods:
      - "GET"
    auth_required: false
database:
  type: "sqlite"
  dsn: "./data/gemini.db"
auth:
  session_key: "a-very-secret-key" # TODO: Change this in a real application
  csrf_key: "gRj1e8E7oXlQocFkJx1sgdIqvKNKOG22wj4lvHF7AfI="
  trusted_origins: # New field for CSRF trusted origins
    - "https://your-production-domain.com" # Placeholder for production
    - "http://localhost:8080" # For local development
static:
  url_prefix: "/static/"
  dir: "static"